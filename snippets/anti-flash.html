<!-- mco-web-style · anti-flash theme boot

     KEEP THIS INLINE in your <head>, before any stylesheet. Loading it from a
     CDN would defer it past first paint and reintroduce the flash of the
     wrong theme it exists to prevent — this snippet is copy-paste by design.

     Precedence: ?theme= URL param → localStorage['mco-theme'] → OS preference.
     Values are validated against a whitelist because mco-theme is shared by
     every MCO app on the origin — never trust a persisted value blindly.

     Since 0.7.0 it also stamps .is-compact / .is-touch on <html>, so CSS keyed
     on them is right on the FIRST frame. mco-core.js stamps and tracks them
     too, but it is a classic script at the end of <body> and can land after
     first paint. The query must match MCO.viewport.COMPACT_MQ in mco-core.js
     exactly (KEEP IN SYNC).

     Since 0.9.0 it also adds .mco-booting, which MCO.ready() removes once the
     app's first meaningful state is applied (a 3 s timeout here removes it
     regardless). The CSP hash changed with it: recompute.

     If your page ships a CSP, script-src must carry the sha256 hash of
     EXACTLY the script element's contents below (whitespace included).
     Recompute after any edit (see README.md § CSP). -->
<script>
  (function () {
    const raw = new URLSearchParams(location.search).get('theme');
    const url = raw == null ? null : raw.toLowerCase();
    let saved = null;
    try { saved = localStorage.getItem('mco-theme'); } catch (e) {}
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const valid = ['dark', 'light', 'high-contrast'];
    const t = valid.includes(url) ? url
            : valid.includes(saved) ? saved
            : (prefersDark ? 'dark' : 'light');
    const root = document.documentElement;
    root.setAttribute('data-theme', t);
    root.classList.toggle('is-compact', window.matchMedia('(max-width: 640px), (max-height: 560px)').matches);
    root.classList.toggle('is-touch', window.matchMedia('(hover: none)').matches);
    // First-paint hold (0.9.0): [data-hold] stays invisible until MCO.ready();
    // this timeout releases it anyway, so a failed script never strands a page.
    root.classList.add('mco-booting');
    setTimeout(function () { root.classList.remove('mco-booting'); }, 3000);
  })();
</script>
