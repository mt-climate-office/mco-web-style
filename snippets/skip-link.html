<!-- mco-web-style · skip link (WCAG 2.4.1)

     Paste as the FIRST element inside <body>. Point href at your main content
     container and give that container id="main" and tabindex="-1" so focus
     actually lands there:

       <main id="main" tabindex="-1"> … </main>

     Styling comes from .mco-skip-link in mco-theme.css: visually offscreen
     until keyboard-focused, then pinned top-left above all chrome. -->
<a class="mco-skip-link" href="#main">Skip to main content</a>
