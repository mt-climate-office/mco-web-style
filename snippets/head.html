<!-- ==========================================================================
     mco-web-style · canonical <head> boilerplate · v0.1.0

     Copy what applies; KEEP the pinned versions and integrity attributes.
     Order matters: metas → anti-flash script (snippets/anti-flash.html goes
     right here, inline) → fonts → stylesheets.

     The kit's JS files are classic scripts. Load them near the end of <body>,
     after maplibre-gl.js and before your app script (tags at the bottom of
     this file).

     SRI hashes below are for v0.1.1 exactly. Bumping the @version without
     recomputing hashes (tools/sri.sh) will hard-fail in the browser — that is
     the point. CI keeps this file honest via tools/check-sri.mjs.
     ========================================================================== -->

<meta charset="UTF-8">
<!-- viewport-fit=cover makes env(safe-area-inset-*) live on notched phones.
     Without it, the safe-area paddings in mco-theme.css silently resolve
     to 0 (two MCO apps shipped that bug — don't repeat it). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="author" content="Montana Climate Office">
<meta name="theme-color" content="#1a6faf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">

<!-- ▸ INLINE the anti-flash script from snippets/anti-flash.html here. -->

<!-- Favicons / app icons (kit-hosted; or vendor them into your repo) -->
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.1.1/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.1.1/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.1.1/assets/apple-touch-icon.png">

<!-- House fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">

<!-- MapLibre GL 5.x — map apps only. The house map library (HOUSE-STYLE.md §7). -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      integrity="sha384-q7EDwLXBfakVimqzBJqFCTxpgy7B18buhebV158qkVMCEVAaUnU3fQTEfWgYz+7g"
      crossorigin="anonymous">

<!-- mco-web-style theme -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.1.1/theme/mco-theme.css"
      integrity="sha384-JhTCCIq3c+mST/Yr0Qor7OBMyG5WlAsYEim/gPQuUaRo7NbLWLbP8485HKwn7Z2N"
      crossorigin="anonymous">
