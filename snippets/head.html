<!-- ==========================================================================
     mco-web-style · canonical <head> boilerplate
     (version + hashes below are kept current by tools/check-sri.mjs in CI)

     Copy what applies; KEEP the pinned versions and integrity attributes.
     Order matters: metas → anti-flash script (snippets/anti-flash.html goes
     right here, inline) → font preloads → stylesheets.

     The kit's JS files are classic scripts. Load them near the end of <body>,
     after maplibre-gl.js and before your app script (tags at the bottom of
     this file).

     SRI hashes below are for v0.7.1 exactly. Bumping the @version without
     recomputing hashes (tools/sri.sh) will hard-fail in the browser — that is
     the point. CI keeps this file honest via tools/check-sri.mjs.
     ========================================================================== -->

<meta charset="UTF-8">
<!-- viewport-fit=cover makes env(safe-area-inset-*) live on notched phones.
     Without it, the safe-area paddings in mco-theme.css silently resolve
     to 0 (two MCO apps shipped that bug — don't repeat it). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="author" content="Montana Climate Office">
<meta name="theme-color" content="#1a6faf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">

<!-- ▸ INLINE the anti-flash script from snippets/anti-flash.html here. -->

<!-- Page title: "<Short name> · <Family>" — HOUSE-STYLE §1 Naming.
     Short name is the shortest DISTINCTIVE word ("Explorer", not "Mesonet
     Explorer"). The FAMILY half has two forms and the surface picks one:
       <title>  -> short   "MT Mesonet" / "MCO"        (tab, truncates at ~15ch)
       og/tw    -> long    "Montana Mesonet" / "Montana Climate Office"
     A tab is read by someone who knows what they opened; a link card is read
     in Slack by someone who may not. The short app name is the same in both.
     og:site_name takes the LONG family alone — not the app name.
<title>Explorer · MT Mesonet</title>
-->

<!-- House fonts — kit-hosted since 0.7.0; the @font-face rules live in
     mco-theme.css. These preloads start both latin files in parallel with the
     stylesheet instead of after it has been parsed, so the first frame is
     already in Outfit (no system-font flash, no swap).
     - Same @version as the theme CSS, or the preload fetches a different file
       from the one @font-face asks for and the font downloads twice.
     - `crossorigin` is REQUIRED on font preloads (fonts are always fetched in
       CORS mode); without it the preload is discarded and fetched again.
     - No `integrity`: @font-face fetches carry none, so an integrity'd preload
       would never match and would double-download. Fonts are inert data, and
       the tag is immutable on jsDelivr.
     CSP: font-src https://cdn.jsdelivr.net (README § CSP notes). -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/fonts/outfit-latin.woff2"
      as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/fonts/space-mono-latin.woff2"
      as="font" type="font/woff2" crossorigin>
