# Downstream canary: load every consumer as it is committed, then again with
# its kit tags served from THIS checkout, in Chromium and WebKit, and diff
# (tools/verify/canary.mjs). Answers "what does this kit change do to the
# apps that pin it?" before a tag exists. Consumers are public repos, checked
# out read-only. Tooling installs ephemerally (AGENTS rule 1).
name: canary

on:
  pull_request:
  workflow_dispatch:

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One job per consumer × browser (0.11.1): the two engines run side by
    # side instead of one after the other, which halves the wall clock.
    name: ${{ matrix.repo }} · ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        repo: [mesonet-status, mesonet-explorer, mesonet-maintenance, mesonet-umrb-build, mco-snowpack-explorer, mesonet-photo-explorer, mesonet-dashboard]
        browser: [chromium, webkit]
        include:
          - { page: index.html }
          - { repo: mesonet-photo-explorer, page: docs/index.html }
          # web-next is the one bundled consumer: build it, then serve dist
          # under its Pages base path, which its asset URLs are absolute to.
          - { repo: mesonet-dashboard, page: mesonet-dashboard/next/index.html, root: site/web-next, build: web-next }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mt-climate-office/${{ matrix.repo }}
          path: consumer/${{ matrix.repo }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling (ephemeral)
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright @axe-core/playwright pngjs pixelmatch
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build (bundled consumers)
        if: matrix.build
        run: |
          (cd consumer/${{ matrix.repo }}/${{ matrix.build }} && npm ci && npm run build)
          mkdir -p ${{ matrix.root }}/$(dirname ${{ matrix.page }})
          cp -R consumer/${{ matrix.repo }}/${{ matrix.build }}/dist/. ${{ matrix.root }}/$(dirname ${{ matrix.page }})/
      - name: Canary
        run: >
          node tools/verify/canary.mjs
          --consumer ${{ matrix.root || format('consumer/{0}', matrix.repo) }}:${{ matrix.page }}
          --browsers ${{ matrix.browser }}
          --accept tools/verify/canary-accept.json
          --out canary-out
      - name: Report
        if: always()
        run: cat canary-out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report (the canary stopped early; see its log)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.repo }}-${{ matrix.browser }}
          path: canary-out/
