# Downstream canary: load every consumer as it is committed, then again with
# its kit tags served from THIS checkout, and diff (tools/verify/canary.mjs).
# Answers "what does this kit change do to the apps that pin it?" before a
# tag exists. Consumers are public repos, checked out read-only. Tooling
# installs ephemerally (AGENTS rule 1).
#
# Tiered (2026-10-22, owner decision: keep the protection, run the expensive
# parts only when they matter). `plan` decides, via .github/scripts/plan.sh:
#   - a PR runs only when it changes bytes a consumer can load (the paths in
#     PATHS_RE) or the canary itself; docs-only PRs skip it;
#   - PRs run Chromium; release candidates (title "vX.Y.Z: …" or the
#     `release` label) and manual dispatches run Chromium and WebKit.
# AGENTS.md § Releasing: the full two-engine canary is green before a tag.
name: canary

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run
        type: choice
        options: ['chromium,webkit', chromium, webkit]
        default: 'chromium,webkit'

concurrency:
  group: canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Everything a consumer can load from the jsDelivr tag, plus the
          # canary's own harness. demo/ and exemplar/ are not loaded by any
          # consumer (checked 2026-10-22), so they are a11y's concern only.
          PATHS_RE: '^(theme|core|map|palette|photos|places|fonts|tokens|assets|snippets)/|^tools/verify/(canary\.mjs|lib\.mjs|canary-accept\.json)$|^\.github/(workflows/canary\.yml|actions/playwright/|scripts/plan\.sh$)'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT_ENGINES: ${{ inputs.engines }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/plan.sh

  consumer:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One job per consumer × browser (0.11.1): the two engines run side by
    # side instead of one after the other, which halves the wall clock.
    # WebKit joins the matrix only for release candidates (see `plan`).
    name: ${{ matrix.repo }} · ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        repo: [mesonet-status, mesonet-explorer, mesonet-maintenance, mesonet-umrb-build, mco-snowpack-explorer, mesonet-photo-explorer, mesonet-dashboard]
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
        include:
          - { page: index.html }
          - { repo: mesonet-photo-explorer, page: docs/index.html }
          # Its live AirTable feed can outlast the canary's network-quiet cap:
          # wait for the stamp to leave "loading…" (canary.mjs --ready).
          - { repo: mesonet-maintenance, ready: "#refresh-stamp::loaded " }
          # web/ is the one bundled consumer (web-next/ until mesonet-dashboard
          # b2a1cf9e, 2026-10-12): build it, then serve dist under its Pages
          # base path (VITE_BASE default /mesonet-dashboard/), which its asset
          # URLs are absolute to.
          - { repo: mesonet-dashboard, page: mesonet-dashboard/index.html, root: site/web, build: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mt-climate-office/${{ matrix.repo }}
          path: consumer/${{ matrix.repo }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright ${{ matrix.browser }} (cached)
        timeout-minutes: 8
        uses: ./.github/actions/playwright
        with:
          engines: ${{ matrix.browser }}
          packages: '@axe-core/playwright@4.13.0 pngjs@7.0.0 pixelmatch@8.0.0'
      - name: Build (bundled consumers)
        if: matrix.build
        run: |
          (cd consumer/${{ matrix.repo }}/${{ matrix.build }} && npm ci && npm run build)
          mkdir -p ${{ matrix.root }}/$(dirname ${{ matrix.page }})
          cp -R consumer/${{ matrix.repo }}/${{ matrix.build }}/dist/. ${{ matrix.root }}/$(dirname ${{ matrix.page }})/
      - name: Canary
        env:
          CANARY_READY: ${{ matrix.ready }}
        run: >
          node tools/verify/canary.mjs
          --consumer ${{ matrix.root || format('consumer/{0}', matrix.repo) }}:${{ matrix.page }}
          --browsers ${{ matrix.browser }}
          --accept tools/verify/canary-accept.json
          --out canary-out
      - name: Report
        if: always()
        run: cat canary-out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report (the canary stopped early; see its log)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.repo }}-${{ matrix.browser }}
          path: canary-out/
