# Internal-consistency gates for mco-web-style. The kit itself is
# zero-dependency; anything installed here is ephemeral test tooling.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check JS
        run: |
          node --check core/mco-core.js
          node --check map/mco-map.js
          node --check map/cog-protocol.js
          node --check palette/mco-palette.js
          node --check photos/mco-photos.js
          node --check places/mco-places.js
          node --check exemplar/app.js
          for f in tools/*.mjs tools/verify/*.mjs; do node --check "$f"; done

      - name: Token parity (CSS themes ↔ tokens.json)
        run: node tools/check-tokens.mjs

      - name: WCAG contrast matrix
        run: node tools/check-contrast.mjs

      # The photo slots are Mountain wall-clock times; the module must not
      # depend on the runner's zone. Kiritimati (UTC+14) and GMT+12 (UTC-12)
      # are the edges that broke shiftDate once.
      - name: MCO.photos unit tests (three zones)
        run: |
          TZ=America/Denver node tools/check-photos.mjs
          TZ=Pacific/Kiritimati node tools/check-photos.mjs
          TZ=Etc/GMT+12 node tools/check-photos.mjs

      # Place search, the searchModel sections it rides on, and the hashes
      # the module carries for its two data files.
      - name: MCO.places unit tests
        run: node tools/check-places.mjs

      # The verify harness's one-retry rule, with fake scenarios (no browser).
      - name: Verify harness retry tests
        run: node tools/check-verify.mjs

      - name: SRI hash freshness
        run: node tools/check-sri.mjs

      - name: Validate HTML
        run: npx --yes html-validate@9 demo/index.html demo/cdn.html exemplar/index.html
