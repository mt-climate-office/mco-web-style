# Copy to .github/workflows/pages.yml in a map app, then set the repo's
# Pages source to "GitHub Actions". vX.Y.Z is a placeholder: use a kit
# release tag, never a branch. The og:image tags in index.html must point
# at image_url with og:image:type image/jpeg.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours, off the hour
  workflow_dispatch:

jobs:
  pages:
    uses: mt-climate-office/mco-web-style/.github/workflows/og-preview.yml@vX.Y.Z
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    with:
      url: https://mt-climate-office.github.io/<repo>/?theme=light
      image_url: https://mesonet.climate.umt.edu/<path>/assets/og-card.jpg
      ready_selector: '#refresh-stamp'
      ready_text: '^Updated '
      seen_keys: mco-<app>-seen-intro
      # site_dir: docs         # when Pages serves a folder
      # width: 1800            # a wider viewport fits all of Montana;
      # height: 945            #   scale 1.3333333333 keeps the 2400×1260 output
      # scale: '1.3333333333'
