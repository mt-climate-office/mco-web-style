# Copy to .github/workflows/check.yml in an app.
# vX.Y.Z is a placeholder: use a kit release tag, never a branch.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: mt-climate-office/mco-web-style/.github/workflows/app-check.yml@vX.Y.Z
